<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Contact de confiance — HelpNaud</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--muted:#5b6678;--line:#dde3ee;--accent:#16304a;--link:#1d5fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#17202f;--ink:#e8edf6;--muted:#9aa7bd;--line:#273246;--accent:#8fb4dc;--link:#8fb4dc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header a.brand{font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
header a.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#16304a;color:#fff}
header nav{margin-left:auto;display:flex;gap:16px;font-size:14px;flex-wrap:wrap}
a{color:var(--link)}
main{max-width:820px;margin:0 auto;padding:24px 16px 48px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px}
h1{margin:0 0 6px;font-size:28px;line-height:1.2;color:var(--accent)}
.meta{margin:0 0 18px;color:var(--muted);font-size:14px}
h2{margin:28px 0 8px;font-size:19px;color:var(--accent)}
h3{margin:18px 0 6px;font-size:16px}
ul{padding-left:22px}li{margin:4px 0}
footer{max-width:820px;margin:0 auto;padding:0 16px 36px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit}
@media print{header,footer{display:none}body{background:#fff}article{border:0;padding:0}}
</style></head><body>
<header><a class="brand" href="/" aria-label="HelpNaud.ai"><b>H</b>HelpNaud</a></header>
<main><article id="box"><h1>Contact de confiance</h1><p id="msg">Chargement…</p><div id="act" hidden>
<p>Si une conversation de cette personne laisse craindre un risque grave pour sa sécurité lié au suicide, HelpNaud pourrait vous en avertir afin que vous preniez de ses nouvelles. <b>Vous ne recevriez jamais le contenu de ses conversations.</b></p>
<label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" id="adult"> <span>Je confirme avoir au moins 18 ans.</span></label>
<button id="ok" style="padding:10px 18px;border-radius:10px;border:0;background:#16304a;color:#fff;font:inherit;cursor:pointer">Accepter</button>
<button id="no" style="padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;margin-left:8px">Refuser</button></div></article></main>
<script>
(function(){var t=(/[?&]t=([0-9a-f]{48})/.exec(location.search)||[])[1],m=document.getElementById('msg'),a=document.getElementById('act');
function call(b){return fetch('/.netlify/functions/family',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()}).catch(function(){return{ok:false,message:'Service injoignable.'}})}
if(!t){m.textContent='Lien invalide.';return}
call({action:'trust_peek',token:t}).then(function(r){if(!r.ok){m.textContent=r.message||'Lien invalide.';return}m.textContent=r.who+' souhaite vous désigner comme contact de confiance dans HelpNaud.';a.hidden=false});
document.getElementById('ok').onclick=function(){call({action:'trust_confirm',token:t,adult:document.getElementById('adult').checked}).then(function(r){if(r.ok){a.hidden=true;m.textContent='Merci : vous êtes maintenant contact de confiance. Cette personne en est informée.'}else m.textContent=r.message||'Échec.'})};
document.getElementById('no').onclick=function(){call({action:'trust_decline',token:t}).then(function(r){if(r.ok){a.hidden=true;m.textContent='Demande refusée. Aucune notification ne vous sera envoyée.'}else m.textContent=r.message||'Échec.'})};
})();
</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FINECIA GROUPE — Partner Market</title>
<style>
  :root{ --bg:#F6F4EF; --surface:#fff; --ink:#16304A; --muted:#5B6B7B; --line:#D9D4C7; --accent:#2D9C93; --gold:#C89B3C; --bad:#B3261E; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F1B28; --surface:#16273A; --ink:#EAF0F6; --muted:#9FB0C2; --line:#2B3E54; --accent:#46C2B8; --gold:#E0B04F; --bad:#F2685C; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main{ max-width:760px; margin:0 auto; padding:20px 16px 48px; }
  header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  header .dot{ width:12px; height:12px; border-radius:50%; background:var(--gold); }
  header strong{ font-size:17px; letter-spacing:.2px; }
  h1{ font-size:24px; margin:0 0 6px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .hint{ color:var(--muted); font-size:13px; margin:4px 0 0; }
  label{ display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
  input,textarea,select{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); color:var(--ink); font:inherit; }
  button{ border:1px solid var(--ink); background:var(--ink); color:var(--surface); border-radius:10px; padding:10px 16px; font:inherit; cursor:pointer; margin-top:14px; }
  button.light{ background:var(--surface); color:var(--ink); border-color:var(--line); margin-top:0; padding:6px 12px; font-size:13px; }
  button:disabled{ opacity:.55; cursor:default; }
  .msg{ margin-top:12px; font-size:14px; }
  .ok{ color:var(--accent); font-weight:600; } .err{ color:var(--bad); font-weight:600; }
  .row{ display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .photos img{ max-width:100%; border-radius:10px; margin-top:8px; display:block; }
</style>
</head>
<body>
<main>
  <header><span class="dot"></span><strong>FINECIA GROUPE</strong><span class="hint" style="margin:0;">Partner Market</span></header>
  <div id="app"><div class="card"><p class="hint">Chargement…</p></div></div>
</main>
<script>
(function(){
  'use strict';
  var FN = '/.netlify/functions/public-intake';
  var Q = new URLSearchParams(location.search);
  var app = document.getElementById('app');
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function call(body){
    return fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }).then(function(r){
      return r.text().then(function(t){ var j = null; try{ j = JSON.parse(t); }catch(e){} if(!r.ok) throw new Error((j && j.error) || 'Service momentanément indisponible.'); return j || {}; });
    });
  }
  function money(n, cur){ var s = Number(n || 0).toLocaleString('fr-FR'); return s + ' ' + (cur === 'CAD' ? '$ CAD' : (cur === 'USD' ? '$ US' : (cur || ''))); }
  var HONEY = '<div class="hp"><label>Site web<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>';
  function hv(){ var e = document.getElementById('website'); return e ? e.value : ''; }

  /* ---------- Inscription par invitation ---------- */
  function viewInvitation(token){
    call({ action:'invite-info', token: token }).then(function(r){
      if(!r.ok){ app.innerHTML = '<div class="card"><h1>Lien d’invitation invalide</h1><p class="hint">Ce lien n’est plus valide. Demandez un nouveau lien à FINECIA GROUPE.</p></div>'; return; }
      app.innerHTML = '<div class="card"><h1>Rejoindre Partner Market</h1><p class="hint">Invitation de FINECIA GROUPE — profil : <strong>' + esc(r.type) + '</strong>. Votre demande sera examinée par notre équipe avant activation.</p>' +
        '<label for="f-name">Nom de l’organisation (ou votre nom)</label><input id="f-name" maxlength="120">' +
        '<label for="f-contact">Personne-contact</label><input id="f-contact" maxlength="100">' +
        '<label for="f-email">Courriel</label><input id="f-email" type="email" maxlength="140">' +
        '<label for="f-phone">Téléphone</label><input id="f-phone" maxlength="40">' +
        '<label for="f-msg">Message (facultatif)</label><textarea id="f-msg" rows="3" maxlength="600"></textarea>' + HONEY +
        policyBoxHtml(r) +
        '<button id="f-send">Envoyer ma demande d’inscription</button><div id="f-out" class="msg"></div></div>';
      document.getElementById('f-send').addEventListener('click', function(){
        var b = this, out = document.getElementById('f-out'); b.disabled = true; out.className = 'msg'; out.textContent = '';
        var pc = document.getElementById('f-policy');
        if(!pc || !pc.checked){ out.className = 'msg err'; out.textContent = 'Veuillez lire et accepter la politique pour continuer.'; b.disabled = false; return; }
        call({ action:'invite-signup', token: token, name: val('f-name'), contact: val('f-contact'), email: val('f-email'), phone: val('f-phone'), message: val('f-msg'), policy: true, website: hv() }).then(function(res){
          var docs = '';
          if(res && res.docToken){
            var link = location.origin + location.pathname + '?doc=' + encodeURIComponent(res.docToken);
            docs = '<div class="card" style="background:var(--bg);"><strong>Documents de votre organisation (facultatif)</strong><p class="hint">Vous pouvez téléverser vos documents maintenant ou plus tard, à partir de votre lien personnel. Gardez ce lien : il est réservé à votre organisation.</p>' +
              '<p style="word-break:break-all;"><a id="f-doclink" href="' + esc(link) + '">' + esc(link) + '</a></p></div>';
          }
          app.innerHTML = '<div class="card"><h1>Merci !</h1><p class="ok">Votre demande est bien reçue.</p><p class="hint">FINECIA GROUPE vous contactera après examen de votre dossier.</p>' + docs + '</div>';
        }).catch(function(e){ out.className = 'msg err'; out.textContent = e.message; b.disabled = false; });
      });
    }).catch(function(e){ app.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p></div>'; });
  }
  /* ---------- Politique de confidentialité et de conduite ---------- */
  var DEFAULT_POLICY = {"partner": "1. Confidentialité des dossiers — Les dossiers, informations sur les clients, prix, offres, conditions et documents échangés par Partner Market et FG & Bank Partnership sont strictement confidentiels. Le partenaire les utilise uniquement pour l’opération visée et ne les communique à aucun tiers sans l’accord écrit de FINECIA GROUPE.\n\n2. Données personnelles des clients — Les coordonnées et renseignements d’un client ne servent qu’au dossier concerné. Toute prospection, revente ou réutilisation en dehors de ce dossier est interdite.\n\n3. Non-contournement — Le partenaire s’engage à ne pas contourner FINECIA GROUPE pour conclure une opération issue d’une mise en relation. Les commissions et frais prévus restent dus, y compris lorsque le client paie la totalité comptant, et y compris sur les garanties et extras ajoutés pendant la négociation.\n\n4. Exactitude et documents — Les informations fournies (identité, activité, prix, état des véhicules, taux) doivent être exactes. Les documents de l’entreprise sont facultatifs à l’inscription ; FINECIA GROUPE peut les demander ultérieurement et le partenaire s’engage à les fournir dans un délai raisonnable.\n\n5. Engagements pris — Les prix, garanties et extras convenus pendant la négociation doivent être respectés. Une garantie ou un service demandé par le client et accepté dans le dossier doit être fourni par le concessionnaire, l’entreprise ou le vendeur.\n\n6. Avertissements — En cas de manquement à cette politique, FINECIA GROUPE peut adresser un avertissement au partenaire.\n\n7. Pause, suspension, retrait — FINECIA GROUPE peut mettre un partenaire en pause pour une durée déterminée (par exemple 10, 20 ou 30 jours, ou plus selon la nature du manquement) : pendant la pause, il ne peut ni soumettre d’offres ni publier d’annonces. En cas de manquement grave, FINECIA GROUPE peut le suspendre sans délai ou le retirer définitivement de la plateforme.\n\n8. Accès aux dossiers internes — Le dossier interne de chaque partenaire (PartnerDoss) est réservé à l’équipe de FINECIA GROUPE ; aucun partenaire n’y a accès.\n\n9. Modification de la politique — FINECIA GROUPE se réserve le droit de modifier cette politique. La version en vigueur et sa date sont indiquées ; la poursuite de l’utilisation après modification vaut acceptation de la nouvelle version.\n\nTexte provisoire à faire valider par un conseiller juridique avant le lancement.", "client": "1. Utilisation de vos informations — Vos coordonnées et renseignements ne servent qu’à traiter votre dossier avec FINECIA GROUPE et ses partenaires concernés (concessionnaire, banque ou microfinance).\n\n2. Aucun document à l’inscription — Aucun document ne vous est demandé avant, pendant ou après votre inscription. Si votre dossier est en cours, notre équipe peut vous contacter pour compléter uniquement les informations de ce dossier.\n\n3. Confidentialité — Vos informations ne sont pas partagées en dehors du dossier sans votre accord, et ne sont jamais vendues.\n\n4. Vos droits — Vous pouvez demander l’accès à vos informations, leur correction ou leur suppression en écrivant à FINECIA GROUPE.\n\n5. Modification — FINECIA GROUPE peut mettre à jour cette politique ; la version en vigueur est toujours affichée à l’inscription.\n\nTexte provisoire à faire valider par un conseiller juridique avant le lancement."};
  function policyBoxHtml(r){
    var pol = (r && r.policy) || {};
    var isClient = r && r.type === 'Client';
    var txt = (isClient ? pol.clientText : pol.partnerText) || (isClient ? DEFAULT_POLICY.client : DEFAULT_POLICY.partner);
    var ver = pol.version || 1;
    return '<div class="card" style="background:var(--bg); margin-top:14px;"><strong>' + (isClient ? 'Politique de confidentialité' : 'Politique de confidentialité et de conduite des partenaires') + ' <span class="hint">(version ' + esc(ver) + ')</span></strong>' +
      '<div id="f-policytext" style="white-space:pre-wrap; font-size:13px; max-height:220px; overflow:auto; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--surface);">' + esc(txt) + '</div>' +
      '<label style="display:flex; gap:8px; align-items:flex-start; color:var(--ink); margin-top:10px;"><input id="f-policy" type="checkbox" style="width:auto; margin-top:4px;"><span>J’ai lu et j’accepte cette politique' + (isClient ? '.' : ' et je m’engage à la respecter. FINECIA GROUPE peut la modifier et adresser des avertissements, mettre en pause, suspendre ou retirer un partenaire.') + '</span></label></div>';
  }
  /* ---------- Dépôt de documents du partenaire (lien personnel) ---------- */
  var DOC_KINDS = ['Registre du commerce / immatriculation','Licence ou agrément','Statuts','Pièce d’identité du représentant','Preuve d’adresse','Attestation fiscale','Assurance','Autre'];
  function fmtSize(n){ n = Number(n) || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + ' Mo' : Math.max(1, Math.round(n / 1024)) + ' Ko'; }
  function viewDocs(token){
    function draw(){
      call({ action:'partner-doc-info', token: token }).then(function(r){
        if(!r.ok){ app.innerHTML = '<div class="card"><h1>Lien non valide</h1><p class="hint">Ce lien n’est plus valide. Contactez FINECIA GROUPE.</p></div>'; return; }
        var req = r.request && r.request.items && r.request.items.length ? '<div class="card" style="background:var(--bg);"><strong>Documents demandés par FINECIA GROUPE</strong><ul>' + r.request.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' + (r.request.note ? '<p class="hint">' + esc(r.request.note) + '</p>' : '') + '</div>' : '<p class="hint">Aucun document n’est exigé pour le moment. Le dépôt est facultatif.</p>';
        var list = (r.docs || []).map(function(d){ return '<div class="row" style="padding:6px 0; border-top:1px solid var(--line);"><span>' + esc(d.name) + ' <span class="hint">· ' + esc(d.kind) + ' · ' + fmtSize(d.size) + '</span></span>' + (d.source === 'partner' ? '<button class="light" data-del="' + esc(d.id) + '">Retirer</button>' : '') + '</div>'; }).join('') || '<p class="hint">Aucun document déposé.</p>';
        var opts = DOC_KINDS.map(function(k){ return '<option>' + esc(k) + '</option>'; }).join('');
        app.innerHTML = '<div class="card"><h1>Documents — ' + esc(r.name) + '</h1><p class="hint">Espace confidentiel : seuls les membres de l’équipe FINECIA GROUPE peuvent consulter vos documents. Formats PDF, JPEG ou PNG, 2 Mo maximum par fichier, 15 fichiers au plus.</p>' + req +
          '<div id="d-list">' + list + '</div>' +
          (r.blocked ? '<p class="err">Votre compte est suspendu : le dépôt est désactivé.</p>' :
          '<label for="d-kind">Type de document</label><select id="d-kind">' + opts + '</select><label for="d-file">Fichier</label><input id="d-file" type="file" accept="application/pdf,image/jpeg,image/png">' + HONEY +
          '<button id="d-send">Téléverser</button>') + '<div id="d-out" class="msg"></div></div>';
        var send = document.getElementById('d-send');
        if(send) send.addEventListener('click', function(){
          var out = document.getElementById('d-out'), f = document.getElementById('d-file').files[0];
          out.className = 'msg'; out.textContent = '';
          if(!f){ out.className = 'msg err'; out.textContent = 'Choisissez un fichier.'; return; }
          if(['application/pdf','image/jpeg','image/png'].indexOf(f.type) === -1){ out.className = 'msg err'; out.textContent = 'Formats acceptés : PDF, JPEG ou PNG.'; return; }
          if(f.size > 2000000){ out.className = 'msg err'; out.textContent = 'Fichier trop volumineux (2 Mo maximum).'; return; }
          send.disabled = true;
          var fr = new FileReader();
          fr.onload = function(){
            call({ action:'partner-doc-put', token: token, kind: document.getElementById('d-kind').value, name: f.name, mime: f.type, data: fr.result, website: hv() }).then(function(){ draw(); })
              .catch(function(e){ out.className = 'msg err'; out.textContent = e.message; send.disabled = false; });
          };
          fr.onerror = function(){ out.className = 'msg err'; out.textContent = 'Lecture du fichier impossible.'; send.disabled = false; };
          fr.readAsDataURL(f);
        });
        Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function(b){
          b.addEventListener('click', function(){ call({ action:'partner-doc-delete', token: token, id: b.getAttribute('data-del') }).then(draw); });
        });
      }).catch(function(e){ app.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p></div>'; });
    }
    draw();
  }

  function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }

  /* ---------- Prendre mon rendez-vous ---------- */
  function viewRdv(){
    call({ action:'slots' }).then(function(r){
      var slots = r.slots || [], chosen = null;
      if(!slots.length){ app.innerHTML = '<div class="card"><h1>Prendre mon rendez-vous</h1><p class="hint">Aucun créneau n’est disponible pour le moment. Revenez bientôt.</p></div>'; return; }
      app.innerHTML = '<div class="card"><h1>Prendre mon rendez-vous</h1><p class="hint">Choisissez un créneau disponible.</p><div id="slots"></div></div>' +
        '<div class="card" id="bookbox" style="display:none;"><div id="picked" class="hint"></div>' +
        '<label for="b-name">Nom et prénom</label><input id="b-name" maxlength="120">' +
        '<label for="b-contact">Courriel ou téléphone</label><input id="b-contact" maxlength="140">' +
        '<label for="b-motif">Motif du rendez-vous</label><input id="b-motif" maxlength="200">' + HONEY +
        '<button id="b-send">Confirmer le rendez-vous</button><div id="b-out" class="msg"></div></div>';
      document.getElementById('slots').innerHTML = slots.map(function(s){
        return '<div class="row" style="padding:7px 0; border-top:1px solid var(--line);"><span>' + esc(s.date) + ' · ' + esc(s.start) + '–' + esc(s.end) + (s.note ? ' · ' + esc(s.note) : '') + '</span><button class="light" data-slot="' + esc(s.id) + '" data-label="' + esc(s.date + ' · ' + s.start + '–' + s.end) + '">Choisir</button></div>';
      }).join('');
      app.addEventListener('click', function(e){
        var b = e.target.closest ? e.target.closest('[data-slot]') : null;
        if(!b) return;
        chosen = b.getAttribute('data-slot');
        document.getElementById('picked').textContent = 'Créneau choisi : ' + b.getAttribute('data-label');
        document.getElementById('bookbox').style.display = 'block';
      });
      document.getElementById('b-send').addEventListener('click', function(){
        var btn = this, out = document.getElementById('b-out'); out.className = 'msg'; out.textContent = '';
        if(!chosen){ out.className = 'msg err'; out.textContent = 'Choisissez un créneau.'; return; }
        btn.disabled = true;
        call({ action:'book', slotId: chosen, name: val('b-name'), contact: val('b-contact'), motif: val('b-motif'), website: hv() }).then(function(){
          app.innerHTML = '<div class="card"><h1>Rendez-vous confirmé</h1><p class="ok">Merci ! Votre créneau est réservé.</p><p class="hint">FINECIA GROUPE vous contactera pour confirmer les détails.</p></div>';
        }).catch(function(e){ out.className = 'msg err'; out.textContent = e.message; btn.disabled = false; });
      });
    }).catch(function(e){ app.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p></div>'; });
  }

  /* ---------- Catalogue de véhicules ---------- */
  function viewCatalogue(token){
    call({ action:'catalogue', token: token }).then(function(r){
      if(!r.ok){ app.innerHTML = '<div class="card"><h1>Accès non valide</h1><p class="hint">Ce lien n’est plus valide. Demandez un nouveau lien à FINECIA GROUPE.</p></div>'; return; }
      var list = r.vehicles || [];
      var html = '<div class="card"><h1>Catalogue de véhicules</h1><p class="hint">Véhicules disponibles chez nos concessionnaires partenaires.</p></div>';
      if(!list.length) html += '<div class="card"><p class="hint">Aucun véhicule disponible pour le moment.</p></div>';
      html += list.map(function(v){
        return '<div class="card" data-v="' + esc(v.id) + '"><div class="row"><div><strong>' + esc(v.make) + ' ' + esc(v.model) + (v.year ? ' (' + esc(v.year) + ')' : '') + '</strong>' +
          '<div class="hint">' + esc(v.dealer) + ' · Prix : ' + esc(money(v.price, v.currency)) + ' · ' + Number(v.mileage || 0).toLocaleString('fr-FR') + ' km</div>' +
          (v.description ? '<div class="hint">' + esc(v.description) + '</div>' : '') + '</div>' +
          '<div>' + (v.photoCount ? '<button class="light" data-photos="' + esc(v.id) + '">📷 VOIR (' + v.photoCount + ')</button> ' : '') +
          '<button class="light" data-interest="' + esc(v.id) + '" style="border-color:var(--ink);">Je suis intéressé</button></div></div>' +
          '<div class="photos" data-photobox="' + esc(v.id) + '"></div><div data-form="' + esc(v.id) + '"></div></div>';
      }).join('');
      app.innerHTML = html;
    }).catch(function(e){ app.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p></div>'; });
    app.addEventListener('click', function(e){
      var ph = e.target.closest ? e.target.closest('[data-photos]') : null;
      if(ph){
        var id = ph.getAttribute('data-photos'), box = app.querySelector('[data-photobox="' + id + '"]');
        if(box.innerHTML){ box.innerHTML = ''; return; }
        box.innerHTML = '<p class="hint">Chargement…</p>';
        call({ action:'photos', token: token, vehicleId: id }).then(function(r){
          box.innerHTML = (r.photos || []).map(function(p){ return '<img alt="Photo du véhicule" src="' + esc(p.data) + '">'; }).join('') || '<p class="hint">Aucune photo.</p>';
        }).catch(function(){ box.innerHTML = '<p class="err">Photos indisponibles.</p>'; });
        return;
      }
      var it = e.target.closest ? e.target.closest('[data-interest]') : null;
      if(it){
        var vid = it.getAttribute('data-interest'), f = app.querySelector('[data-form="' + vid + '"]');
        if(f.innerHTML){ f.innerHTML = ''; return; }
        f.innerHTML = '<label>Nom et prénom</label><input data-n maxlength="100"><label>Courriel ou téléphone</label><input data-c maxlength="140">' + HONEY.replace('id="website"', 'class="website-x"') +
          '<button data-send="' + esc(vid) + '">Envoyer ma demande</button><div class="msg" data-out></div>';
        return;
      }
      var sd = e.target.closest ? e.target.closest('[data-send]') : null;
      if(sd){
        var v2 = sd.getAttribute('data-send'), form = app.querySelector('[data-form="' + v2 + '"]'), out = form.querySelector('[data-out]');
        sd.disabled = true; out.className = 'msg'; out.textContent = '';
        call({ action:'interest', token: token, vehicleId: v2, name: form.querySelector('[data-n]').value.trim(), contact: form.querySelector('[data-c]').value.trim(), website: (form.querySelector('.website-x') || { value:'' }).value || '' }).then(function(){
          form.innerHTML = '<p class="ok">Merci ! Un conseiller FINECIA GROUPE vous contactera très bientôt.</p>';
        }).catch(function(err){ out.className = 'msg err'; out.textContent = err.message; sd.disabled = false; });
      }
    });
  }


  /* ---------- FINECIA ACADÉMIE : catalogue + inscription ---------- */
  var GEO_COUNTRIES = [["Canada", "Amérique du Nord"], ["États-Unis", "Amérique du Nord"], ["Mexique", "Amérique du Nord"], ["France", "Europe"], ["Belgique", "Europe"], ["Suisse", "Europe"], ["Luxembourg", "Europe"], ["Allemagne", "Europe"], ["Italie", "Europe"], ["Espagne", "Europe"], ["Portugal", "Europe"], ["Royaume-Uni", "Europe"], ["Pays-Bas", "Europe"], ["Bénin", "Afrique de l'Ouest"], ["Burkina Faso", "Afrique de l'Ouest"], ["Côte d'Ivoire", "Afrique de l'Ouest"], ["Ghana", "Afrique de l'Ouest"], ["Guinée", "Afrique de l'Ouest"], ["Mali", "Afrique de l'Ouest"], ["Mauritanie", "Afrique de l'Ouest"], ["Niger", "Afrique de l'Ouest"], ["Nigeria", "Afrique de l'Ouest"], ["Sénégal", "Afrique de l'Ouest"], ["Togo", "Afrique de l'Ouest"], ["Sierra Leone", "Afrique de l'Ouest"], ["Liberia", "Afrique de l'Ouest"], ["Cap-Vert", "Afrique de l'Ouest"], ["Gambie", "Afrique de l'Ouest"], ["Guinée-Bissau", "Afrique de l'Ouest"], ["Cameroun", "Afrique centrale"], ["Congo (Brazzaville)", "Afrique centrale"], ["RD Congo", "Afrique centrale"], ["Gabon", "Afrique centrale"], ["Guinée équatoriale", "Afrique centrale"], ["Tchad", "Afrique centrale"], ["Centrafrique", "Afrique centrale"], ["Burundi", "Afrique centrale"], ["Rwanda", "Afrique de l'Est"], ["Kenya", "Afrique de l'Est"], ["Éthiopie", "Afrique de l'Est"], ["Tanzanie", "Afrique de l'Est"], ["Ouganda", "Afrique de l'Est"], ["Djibouti", "Afrique de l'Est"], ["Madagascar", "Afrique de l'Est"], ["Maurice", "Afrique de l'Est"], ["Comores", "Afrique de l'Est"], ["Algérie", "Afrique du Nord"], ["Maroc", "Afrique du Nord"], ["Tunisie", "Afrique du Nord"], ["Égypte", "Afrique du Nord"], ["Libye", "Afrique du Nord"], ["Afrique du Sud", "Afrique australe"], ["Angola", "Afrique australe"], ["Mozambique", "Afrique australe"], ["Zambie", "Afrique australe"], ["Zimbabwe", "Afrique australe"], ["Namibie", "Afrique australe"], ["Botswana", "Afrique australe"], ["Haïti", "Amérique latine & Caraïbes"], ["Brésil", "Amérique latine & Caraïbes"], ["Colombie", "Amérique latine & Caraïbes"], ["Argentine", "Amérique latine & Caraïbes"], ["Chili", "Amérique latine & Caraïbes"], ["Pérou", "Amérique latine & Caraïbes"], ["Martinique", "Amérique latine & Caraïbes"], ["Guadeloupe", "Amérique latine & Caraïbes"], ["Chine", "Asie"], ["Inde", "Asie"], ["Japon", "Asie"], ["Vietnam", "Asie"], ["Liban", "Moyen-Orient"], ["Arabie saoudite", "Moyen-Orient"], ["Émirats arabes unis", "Moyen-Orient"], ["Qatar", "Moyen-Orient"], ["Turquie", "Moyen-Orient"], ["Australie", "Océanie"], ["Nouvelle-Zélande", "Océanie"]];
  var GEO_REGIONS = ["Amérique du Nord", "Amérique latine & Caraïbes", "Europe", "Afrique de l'Ouest", "Afrique centrale", "Afrique de l'Est", "Afrique du Nord", "Afrique australe", "Moyen-Orient", "Asie", "Océanie", "Autre"];
  var A_FORMATS = ['Présentiel haut de gamme', 'En ligne', 'Hybride', 'Intra-entreprise', 'Inter-entreprises', 'Masterclass 90 minutes', 'Workshop ½ ou 1 journée', 'Bootcamp 2 à 5 jours', 'Programme sur mesure'];
  var A_DURATIONS = ['90 minutes', '½ journée', '1 journée', '2 à 5 jours', '8 semaines', 'Coaching mensuel', 'Mission d’accompagnement', 'Sur mesure'];
  function opts(list){ return list.map(function(x){ return '<option>' + esc(x) + '</option>'; }).join('') + '<option value="__autre__">Autre (à préciser)</option>'; }
  function viewAcademie(){
    call({ action:'academie-catalogue' }).then(function(r){
      var list = r.formations || [], cats = [];
      list.forEach(function(f){ var c = f.cat || 'Formations'; if(cats.indexOf(c) === -1) cats.push(c); });
      var html = '<div class="card"><h1>FINECIA Academy</h1><p class="hint">Former les décideurs qui feront avancer les organisations. Des formations appliquées, ateliers exécutifs et workshops conçus à partir de situations réelles.</p></div>';
      html += cats.map(function(c){
        return '<div class="card"><strong>' + esc(c) + '</strong>' + list.filter(function(f){ return (f.cat || 'Formations') === c; }).map(function(f){
          var price = f.onRequest ? 'Sur demande' : money(f.price, f.currency);
          var meta = [f.level, f.duration, f.audience].filter(Boolean).join(' · ');
          return '<div class="row" style="padding:9px 0; border-top:1px solid var(--line);"><div style="flex:1; min-width:200px;"><div><strong>' + esc(f.title) + '</strong></div>' +
            (f.description ? '<div class="hint">' + esc(f.description) + '</div>' : '') + (meta ? '<div class="hint">' + esc(meta) + '</div>' : '') + '</div>' +
            '<div style="text-align:right;"><div><strong>' + esc(price) + '</strong></div><button class="light" data-pick="' + esc(f.id) + '">S’inscrire</button></div></div>';
        }).join('') + '</div>';
      }).join('');
      html += '<div class="card" id="reg"><h1 style="font-size:20px;">Formulaire d’inscription</h1>' +
        '<label for="a-name">Nom et prénom</label><input id="a-name" maxlength="120">' +
        '<label for="a-email">Courriel</label><input id="a-email" type="email" maxlength="140">' +
        '<label for="a-phone">Téléphone</label><input id="a-phone" maxlength="40">' +
        '<label for="a-country">Pays de résidence</label><input id="a-country" list="a-country-list" maxlength="80" autocomplete="country-name"><datalist id="a-country-list">' + GEO_COUNTRIES.map(function(c){ return '<option value="' + esc(c[0]) + '">'; }).join('') + '</datalist>' +
        '<label for="a-province">Province / État / Région de résidence</label><input id="a-province" maxlength="80">' +
        '<label for="a-city">Ville</label><input id="a-city" maxlength="80" autocomplete="address-level2">' +
        '<label for="a-region">Région / Continent</label><select id="a-region"><option value="">Choisir…</option>' + GEO_REGIONS.map(function(r){ return '<option>' + esc(r) + '</option>'; }).join('') + '</select>' +
        '<label for="a-org">Organisation / entreprise (facultatif)</label><input id="a-org" maxlength="120">' +
        '<label for="a-formation">Formation</label><select id="a-formation"><option value="">Choisir…</option>' + list.map(function(f){ return '<option value="' + esc(f.id) + '">' + esc(f.title) + '</option>'; }).join('') + '<option value="__autre__">Autre (à préciser)</option></select>' +
        '<input id="a-formation-o" maxlength="120" placeholder="Formation souhaitée (à préciser)" style="display:none; margin-top:6px;">' +
        '<label for="a-format">Format</label><select id="a-format">' + opts(A_FORMATS) + '</select><input id="a-format-o" maxlength="80" placeholder="Format (à préciser)" style="display:none; margin-top:6px;">' +
        '<label for="a-duration">Durée</label><select id="a-duration">' + opts(A_DURATIONS) + '</select><input id="a-duration-o" maxlength="60" placeholder="Durée (à préciser)" style="display:none; margin-top:6px;">' +
        '<label for="a-msg">Message (facultatif)</label><textarea id="a-msg" rows="3" maxlength="600"></textarea>' + HONEY +
        '<label style="display:flex; gap:8px; align-items:flex-start; color:var(--ink); margin-top:14px;"><input type="checkbox" id="a-consent" style="width:auto; margin-top:4px;"><span>J’accepte que FINECIA GROUPE utilise ces informations uniquement pour répondre à ma demande d’inscription.</span></label>' +
        '<button id="a-send">Envoyer mon inscription</button><div id="a-out" class="msg"></div></div>';
      app.innerHTML = html;
      function toggle(sel, inp){ var s = document.getElementById(sel); s.addEventListener('change', function(){ document.getElementById(inp).style.display = s.value === '__autre__' ? '' : 'none'; }); }
      document.getElementById('a-country').addEventListener('change', function(){
        var v = this.value.trim().toLowerCase(), r = document.getElementById('a-region');
        GEO_COUNTRIES.forEach(function(c){ if(c[0].toLowerCase() === v) r.value = c[1]; });
      });
      toggle('a-formation', 'a-formation-o'); toggle('a-format', 'a-format-o'); toggle('a-duration', 'a-duration-o');
      app.addEventListener('click', function(e){
        var b = e.target.closest ? e.target.closest('[data-pick]') : null;
        if(!b) return;
        document.getElementById('a-formation').value = b.getAttribute('data-pick');
        document.getElementById('reg').scrollIntoView({ behavior:'smooth' });
      });
      document.getElementById('a-send').addEventListener('click', function(){
        var btn = this, out = document.getElementById('a-out'); out.className = 'msg'; out.textContent = '';
        var fv = document.getElementById('a-formation').value;
        if(!fv){ out.className = 'msg err'; out.textContent = 'Choisissez une formation.'; return; }
        function pick(sel, inp){ var v = document.getElementById(sel).value; return v === '__autre__' ? val(inp) : v; }
        if(val('a-country').length < 2){ out.className = 'msg err'; out.textContent = 'Indiquez votre pays de résidence.'; return; }
        btn.disabled = true;
        call({ action:'academie-register', country: val('a-country'), province: val('a-province'), city: val('a-city'), region: val('a-region'), organisation: val('a-org'), name: val('a-name'), email: val('a-email'), phone: val('a-phone'),
          formationId: fv === '__autre__' ? '' : fv, formationOther: fv === '__autre__' ? val('a-formation-o') : '',
          format: pick('a-format', 'a-format-o'), duration: pick('a-duration', 'a-duration-o'), message: val('a-msg'),
          consent: document.getElementById('a-consent').checked, website: hv() }).then(function(){
          app.innerHTML = '<div class="card"><h1>Merci !</h1><p class="ok">Votre inscription est bien reçue.</p><p class="hint">Un conseiller FINECIA GROUPE vous contactera pour confirmer les détails.</p></div>';
        }).catch(function(err){ out.className = 'msg err'; out.textContent = err.message; btn.disabled = false; });
      });
    }).catch(function(e){ app.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p></div>'; });
  }

  if(Q.get('academie')) viewAcademie();
  else if(Q.get('invitation')) viewInvitation(Q.get('invitation'));
  else if(Q.get('catalogue')) viewCatalogue(Q.get('catalogue'));
  else if(Q.get('doc')) viewDocs(Q.get('doc'));
  else if(Q.get('rdv')) viewRdv();
  else app.innerHTML = '<div class="card"><h1>FINECIA GROUPE</h1><p class="hint">Cette page s’ouvre depuis un lien envoyé par FINECIA GROUPE (invitation, rendez-vous ou catalogue).</p></div>';
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conversation partagée — HelpNaud.ai</title>
<style>
:root{ --bg:#f5f6fa; --surface:#fff; --ink:#111827; --muted:#5b6475; --line:#e3e6ee; --accent:#1f4f94; --user:#1f4f94; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0f1218; --surface:#161b24; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2a3140; --accent:#7aa7e8; --user:#2b5aa8; } }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
header{ background:var(--surface); border-bottom:1px solid var(--line); padding:12px 16px; }
.wrap{ max-width:820px; margin:0 auto; padding:0 16px; }
header .wrap{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:0; }
header b{ font-size:16px; }
header span{ color:var(--muted); font-size:13px; }
main{ padding:20px 0 40px; }
h1{ font-size:20px; margin:0 0 4px; overflow-wrap:anywhere; }
.meta{ color:var(--muted); font-size:13px; margin:0 0 18px; }
.msg{ margin:0 0 18px; overflow-wrap:anywhere; }
.msg.user{ background:var(--user); color:#fff; padding:10px 16px; border-radius:18px; max-width:85%; margin-left:auto; white-space:pre-wrap; }
.msg.assistant p{ margin:0 0 .85em; } .msg.assistant li{ margin:.25em 0; }
.msg pre{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow-x:auto; font-size:13px; }
.msg code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em; background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:0 4px; }
.msg pre code{ border:0; padding:0; background:none; }
.msg table{ border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; font-size:14px; }
.msg th,.msg td{ border:1px solid var(--line); padding:5px 9px; text-align:left; }
.err{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center; }
footer{ color:var(--muted); font-size:12.5px; text-align:center; padding:0 16px 30px; }
footer a{ color:var(--accent); }
</style>
</head>
<body>
<header><div class="wrap"><b>HelpNaud.ai</b><span>Conversation partagée · lecture seule</span></div></header>
<main><div class="wrap" id="root"><p class="meta">Chargement…</p></div></main>
<footer>Contenu généré par une IA : il peut contenir des erreurs. Cette page affiche uniquement le texte de la conversation. · <a href="/">HelpNaud.ai</a></footer>
<script>
(function(){
  'use strict';
  var root = document.getElementById('root');
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function inline(parent, s){
    var re = /(\*\*[^*]+\*\*|`[^`]+`)/g, last = 0, m;
    while((m = re.exec(s))){
      if(m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      var t = m[0];
      if(t.charAt(0) === '`') parent.appendChild(el('code', null, t.slice(1, -1)));
      else parent.appendChild(el('strong', null, t.slice(2, -2)));
      last = m.index + t.length;
    }
    if(last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function render(text){
    var box = el('div', 'msg assistant'), lines = String(text).replace(/\r/g, '').split('\n'), i = 0;
    while(i < lines.length){
      var L = lines[i];
      if(/^```/.test(L)){ var code = []; i++; while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; } i++; var pre = el('pre'); pre.appendChild(el('code', null, code.join('\n'))); box.appendChild(pre); continue; }
      if(/^\s*$/.test(L)){ i++; continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(L);
      if(h){ var hh = el('h' + Math.min(4, h[1].length + 1)); hh.style.margin = '1em 0 .4em'; inline(hh, h[2]); box.appendChild(hh); i++; continue; }
      if(/^\s*[-*]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L)){
        var ord = /^\s*\d+[.)]/.test(L), ul = el(ord ? 'ol' : 'ul');
        while(i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+[.)]\s+/.test(lines[i]))){ var li = el('li'); inline(li, lines[i].replace(/^\s*([-*]|\d+[.)])\s+/, '')); ul.appendChild(li); i++; }
        box.appendChild(ul); continue;
      }
      if(/^\s*\|.*\|\s*$/.test(L)){
        var rows = []; while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
        var tb = el('table'), n = 0;
        rows.forEach(function(r){ if(/^\s*\|[\s:|-]+\|\s*$/.test(r)) return; var tr = el('tr'); r.trim().replace(/^\||\|$/g, '').split('|').forEach(function(c){ var td = el(n === 0 ? 'th' : 'td'); inline(td, c.trim()); tr.appendChild(td); }); tb.appendChild(tr); n++; });
        box.appendChild(tb); continue;
      }
      var para = []; while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^(```|#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])){ para.push(lines[i]); i++; }
      if(!para.length){ para.push(lines[i]); i++; }
      var p = el('p'); inline(p, para.join(' ')); box.appendChild(p);
    }
    return box;
  }
  function fail(msg){ root.textContent = ''; var d = el('div', 'err'); d.appendChild(el('h1', null, 'Lien indisponible')); d.appendChild(el('p', 'meta', msg)); root.appendChild(d); }
  var id = new URLSearchParams(location.search).get('c') || '';
  if(!/^[A-Za-z0-9_-]{16,40}$/.test(id)){ fail('Ce lien n’est pas valide.'); return; }
  fetch('/.netlify/functions/share?id=' + encodeURIComponent(id)).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, j:j }; }); }).then(function(x){
    if(!x.ok){ fail(x.j && x.j.message || 'Ce lien n’existe pas ou a été désactivé.'); return; }
    var j = x.j; document.title = (j.title || 'Conversation') + ' — HelpNaud.ai';
    root.textContent = '';
    root.appendChild(el('h1', null, j.title || 'Conversation'));
    var d = ''; try{ d = new Date(j.created).toLocaleDateString('fr-CA', { year:'numeric', month:'long', day:'numeric' }); }catch(e){}
    root.appendChild(el('p', 'meta', 'Partagée le ' + d + ' · ' + (j.messages || []).length + ' messages'));
    (j.messages || []).forEach(function(m){ if(m.role === 'user') root.appendChild(el('div', 'msg user', m.content)); else root.appendChild(render(m.content)); });
  }, function(){ fail('Impossible de charger la conversation. Vérifiez votre connexion.'); });
})();
</script>
</body>
</html>

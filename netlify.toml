# HelpNaud.ai — déploiement Netlify (site statique, aucune étape de build pour l'instant)
[build]
  publish = "."
[functions]
  directory = "netlify/functions"  
# Assistant IA : durée maximale (les recherches web sont plus longues)
[functions."ai"]
  timeout = 26
# Rappels de rendez-vous : exécution toutes les heures (fuseau UTC)
[functions."rdv-reminders"]
  schedule = "@hourly"
# Rappels de tâches par courriel : toutes les 10 minutes
[functions."task-reminders-cron"]
  schedule = "*/10 * * * *"
# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Traductions de l'interface : seuls le manifeste et les fichiers de langue sont publics
[[headers]]
  for = "/i18n/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/i18n/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[redirects]]
  from = "/i18n/source.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/sensible.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/review.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/cost-report.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/glossary-*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/*.errors.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true


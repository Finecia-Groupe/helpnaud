# HelpNaud.ai — déploiement Netlify (site statique, aucune étape de build pour l'instant)
[build]
  publish = "."
[functions]
  directory = "netlify/functions"  
# Assistant IA : durée maximale (les recherches web sont plus longues)
[functions."ai"]
  timeout = 26
# Rappels de rendez-vous : exécution toutes les heures (fuseau UTC)
[functions."rdv-reminders"]
  schedule = "@hourly"
# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Page d'aide « Plateforme » (lien de l'avertissement sous les réponses de l'IA)
[[redirects]]
  from = "/Platforme"
  to = "/platforme.html"
  status = 200
  force = true
[[redirects]]
  from = "/platforme"
  to = "/platforme.html"
  status = 200
  force = true
[[redirects]]
  from = "/Plateforme"
  to = "/platforme.html"
  status = 200
  force = true
